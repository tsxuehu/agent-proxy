<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Agent Proxy</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script src="/assets/console.js" defer></script>
</head>
<body data-admin="{{.Admin}}" data-gateway="{{.Gateway}}">
  <header class="masthead"><div class="wrap"><a href="/">Agent Proxy</a><span>{{.Title}}</span></div></header>
  <main class="wrap">
    <h1>{{.Title}}</h1>
    <form id="login" class="login">
      <label for="token">{{if .Admin}}管理员令牌{{else}}用户控制台令牌{{end}}</label>
      <div class="inline"><input id="token" type="password" required autocomplete="off"><button>连接</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <output id="secret" class="secret" hidden></output>
    <div id="workspace" hidden>
      {{if .Admin}}
      <section>
        <h2>Codex 池化账号</h2>
        <form id="account" class="fields">
          <label>账号备注<input name="label" maxlength="255"></label>
          <label>已授权账号凭据<input name="credential" type="file" accept=".json,application/json" required></label>
          <button>导入账号</button>
        </form>
        <div class="table-area"><table><thead><tr><th>账号</th><th>备注</th><th>续期状态</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></div>
      </section>
      <section>
        <h2>模型 API Key</h2>
        <p class="muted">保存的 Key 用于后续接入厂商 API。</p>
        <form id="provider-key" class="fields">
          <label>厂商<select name="provider"><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="glm">智谱 GLM</option></select></label>
          <label>备注<input name="label" required maxlength="255"></label>
          <label>API Key<input name="key" type="password" required autocomplete="off"></label>
          <button>保存 Key</button>
        </form>
        <div class="table-area"><table><thead><tr><th>厂商</th><th>备注</th><th>操作</th></tr></thead><tbody id="provider-keys"></tbody></table></div>
      </section>
      <section>
        <h2>用户访问</h2>
        <form id="user" class="fields">
          <label>用户 ID<input name="user_id" required maxlength="128"></label>
          <button>签发或替换令牌</button>
        </form>
      </section>
      {{else}}
      <section>
        <h2 id="endpoint-heading">创建接入端点</h2>
        <form id="endpoint" class="fields">
          <label>接入工具<select name="protocol"><option value="responses">Codex CLI</option><option value="messages">Claude Code</option></select></label>
          <label>目标上游<select name="backend" required></select></label>
          <label class="wide">模型映射 <span class="muted">每行填写 别名=上游模型</span><textarea name="models" rows="3" required placeholder="my-model=上游模型 ID"></textarea></label>
          <label id="enabled-row" class="inline" hidden><input name="enabled" type="checkbox" checked>启用端点</label>
          <button>保存端点</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>取消编辑</button>
        </form>
      </section>
      <section>
        <h2>我的端点</h2>
        <div class="table-area"><table><thead><tr><th>工具</th><th>上游</th><th>基础地址</th><th>状态</th><th>操作</th></tr></thead><tbody id="endpoints"></tbody></table></div>
      </section>
      {{end}}
    </div>
  </main>
</body>
</html>
