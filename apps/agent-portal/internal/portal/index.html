<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户控制台 · Agent Proxy</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script src="/assets/console.js" defer></script>
</head>
<body data-gateway="{{.Gateway}}">
  <header class="masthead"><div class="wrap">
    <a href="/">Agent Proxy</a><span>用户中心</span>
    <div id="signed-in" class="account" hidden><span id="account-name"></span><button type="button" id="logout" class="secondary">退出登录</button></div>
  </div></header>
  <main class="wrap">
    <section id="auth" class="auth" aria-labelledby="auth-title" hidden>
      <div class="auth-switch" id="auth-switch" hidden>
        <button type="button" data-mode="login" aria-pressed="true">登录</button>
        <button type="button" data-mode="signup" aria-pressed="false">注册</button>
      </div>
      <h1 id="auth-title">登录用户中心</h1>
      <form id="login" class="auth-form" method="post">
        <label>用户名<input name="username" required maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
        <label>密码<input name="password" type="password" required maxlength="256" autocomplete="current-password"></label>
        <button>登录</button>
      </form>
      <form id="signup" class="auth-form" method="post" hidden>
        <label>用户名<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,31}" autocomplete="username" autocapitalize="none" spellcheck="false"><span class="muted">3–32 位字母、数字、点、下划线或连字符，以字母或数字开头</span></label>
        <label>密码<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"><span class="muted">至少 12 个字符</span></label>
        <button>创建账号</button>
      </form>
      <form id="token-login" class="auth-form" method="post" hidden>
        <label>用户控制台令牌<input name="token" type="password" required autocomplete="off"></label>
        <button>连接</button>
      </form>
      <button type="button" id="auth-toggle" class="text-button">使用控制台令牌登录</button>
    </section>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <output id="secret" class="secret" hidden></output>
    <div id="workspace" hidden>
      <h1>端点管理</h1>
      <section>
        <h2 id="endpoint-heading">创建接入端点</h2>
        <form id="endpoint" class="fields">
          <label>接入工具<select name="protocol"><option value="responses">Codex CLI</option><option value="messages">Claude Code</option></select></label>
          <label>目标上游<select name="backend" required></select></label>
          <label class="wide">模型映射 <span class="muted">每行填写 别名=上游模型</span><textarea name="models" rows="3" required placeholder="my-model=上游模型 ID"></textarea></label>
          <label id="enabled-row" class="inline" hidden><input name="enabled" type="checkbox" checked>启用端点</label>
          <button>保存端点</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>取消编辑</button>
        </form>
      </section>
      <section>
        <h2>我的端点</h2>
        <div class="table-area"><table><thead><tr><th>工具</th><th>上游</th><th>基础地址</th><th>状态</th><th>操作</th></tr></thead><tbody id="endpoints"></tbody></table></div>
      </section>
    </div>
  </main>
</body>
</html>
