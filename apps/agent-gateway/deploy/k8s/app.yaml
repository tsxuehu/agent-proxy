apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-gateway
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: agent-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: agent-gateway
      containers:
        - name: app
          image: agent-gateway:dev
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: AGENT_MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: agent-proxy
                  key: AGENT_MYSQL_DSN
            - name: AGENT_RELAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-proxy
                  key: AGENT_RELAY_TOKEN
            - name: AGENT_FORWARDER_ADDR
              value: dns:///agent-forwarder:9090
---
apiVersion: v1
kind: Service
metadata:
  name: agent-gateway
spec:
  selector:
    app: agent-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agent-gateway
