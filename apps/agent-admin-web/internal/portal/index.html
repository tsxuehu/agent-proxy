<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统管理 · Agent Proxy</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script src="/assets/console.js" defer></script>
</head>
<body data-gateway="{{.Gateway}}">
  <header class="masthead"><div class="wrap"><a href="/">Agent Proxy</a><span>系统管理</span></div></header>
  <main class="wrap">
    <h1>系统管理</h1>
    <form id="login" class="login">
      <label for="token">管理员令牌</label>
      <div class="inline"><input id="token" type="password" required autocomplete="off"><button>连接</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <output id="secret" class="secret" hidden></output>
    <div id="workspace" hidden>
      <section>
        <h2>Codex 池化账号</h2>
        <form id="account" class="fields">
          <label>账号备注<input name="label" maxlength="255"></label>
          <label>已授权账号凭据<input name="credential" type="file" accept=".json,application/json" required></label>
          <button>导入账号</button>
        </form>
        <div class="table-area"><table><thead><tr><th>账号</th><th>备注</th><th>续期状态</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></div>
      </section>
      <section>
        <h2>模型 API Key</h2>
        <p class="muted">保存的 Key 用于后续接入厂商 API。</p>
        <form id="provider-key" class="fields">
          <label>厂商<select name="provider"><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="glm">智谱 GLM</option></select></label>
          <label>备注<input name="label" required maxlength="255"></label>
          <label>API Key<input name="key" type="password" required autocomplete="off"></label>
          <button>保存 Key</button>
        </form>
        <div class="table-area"><table><thead><tr><th>厂商</th><th>备注</th><th>操作</th></tr></thead><tbody id="provider-keys"></tbody></table></div>
      </section>
      <section>
        <h2>用户访问</h2>
        <form id="user" class="fields">
          <label>用户 ID<input name="user_id" required maxlength="128"></label>
          <button>签发或替换令牌</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
