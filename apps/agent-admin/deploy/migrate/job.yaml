apiVersion: batch/v1
kind: Job
metadata:
  name: agent-proxy-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: agent-admin:dev
          args: [migrate]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: AGENT_MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: agent-proxy
                  key: AGENT_MYSQL_DSN
