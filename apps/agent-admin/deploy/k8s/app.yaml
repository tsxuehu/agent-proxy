apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-admin
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: agent-admin
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: agent-admin
      containers:
        - name: app
          image: agent-admin:dev
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: AGENT_MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: agent-proxy
                  key: AGENT_MYSQL_DSN
            - name: AGENT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agent-proxy
                  key: AGENT_REDIS_URL
            - name: AGENT_ALLOW_SIGNUP
              value: "false"
            - name: AGENT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-proxy
                  key: AGENT_ADMIN_TOKEN
            - name: AGENT_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-proxy
                  key: AGENT_CREDENTIAL_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: agent-admin
spec:
  selector:
    app: agent-admin
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-admin
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agent-admin
