syntax = "proto3";

package relay.v1;

option go_package = "github.com/tsxuehu/agent-proxy/api/relay/v1;relayv1";

service Relay {
  rpc Forward(stream Request) returns (stream Event);
}

message Request {
  oneof payload {
    Open open = 1;
    bytes turn = 2;
  }
}

message Open {
  string endpoint_id = 1;
  uint64 route_version = 2;
  string user_id = 3;
  string backend = 4;
  string session_id = 5;
  string operation = 6;
  bool websocket = 7;
  map<string, string> headers = 8;
  string key_id = 9;
}

message Event {
  oneof payload {
    Head head = 1;
    bytes data = 2;
    Done done = 3;
  }
}

message Head {
  int32 status = 1;
  map<string, string> headers = 2;
}

message Done {}
